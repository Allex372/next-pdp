# CodeBuild: SSR bundle → artifact for CodeDeploy on EC2
# CodePipeline: Source → Build (this file) → Deploy (CodeDeploy)
version: 0.2

env:
  variables:
    DEPLOY_TARGET: ssr
    ENV_BUCKET: REPLACE_ME

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci

  pre_build:
    commands:
      - echo "Pulling production env from S3..."
      - aws s3 cp "s3://$ENV_BUCKET/env/.env.production" .env.production
      - set -a && source .env.production && set +a

  build:
    commands:
      - npm run build:ssr
      - test -d .next
      - mkdir -p artifact
      - cp -r .next public package.json package-lock.json next.config.ts artifact/
      - cp .env.production artifact/.env.production
      - cp deploy/ssr/appspec.yml artifact/appspec.yml
      - cp -r deploy/ssr/scripts artifact/scripts
      - chmod +x artifact/scripts/*.sh

artifacts:
  files:
    - "**/*"
  base-directory: artifact

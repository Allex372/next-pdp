# CodeBuild: SSR bundle → artifact for CodeDeploy on EC2
# CodePipeline: Source → Build (this file) → Deploy (CodeDeploy)
version: 0.2

env:
  variables:
    DEPLOY_TARGET: ssr
    ENV_BUCKET: pdp-env-config-162133619884
    ENV_FILE: env/.env.ssr.production

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - npm ci

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - echo "Pulling production env from S3..."
      - aws s3 cp "s3://$ENV_BUCKET/$ENV_FILE" "$CODEBUILD_SRC_DIR/.env.production"
      - set -a && . "$CODEBUILD_SRC_DIR/.env.production" && set +a

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - npm run build:ssr
      - test -d .next
      # Install production deps in CodeBuild (faster/reliable network) so EC2
      # AfterInstall does not run npm ci — that often times out on small instances.
      - rm -rf node_modules
      - npm ci --omit=dev
      - test -d node_modules/next
      - test -d node_modules/express
      - mkdir -p artifact
      - cp -r .next public server node_modules package.json package-lock.json next.config.ts artifact/
      - cp "$CODEBUILD_SRC_DIR/.env.production" artifact/.env.production
      - cp deploy/ssr/appspec.yml artifact/appspec.yml
      - cp -r deploy/ssr/scripts artifact/scripts
      - chmod +x artifact/scripts/*.sh

artifacts:
  files:
    - "**/*"
  base-directory: artifact

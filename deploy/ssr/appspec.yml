version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/next-pdp
permissions:
  - object: /var/www/next-pdp
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
  - object: /var/www/next-pdp
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 644
    type:
      - file
hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 120
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: ec2-user
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root
